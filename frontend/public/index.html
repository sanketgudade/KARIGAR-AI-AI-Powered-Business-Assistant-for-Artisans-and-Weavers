                                setCurrentView('artisan');
                                setArtisanPage('negotiations');
                                setSelectedProductModal(null);
                              }}
                              className="w-full bg-karigar-dark hover:bg-karigar-darkAlt text-white font-semibold py-3 rounded-xl text-xs transition"
                            >
                              Submit Wholesale Offer (Triggers Agent 4 & Gate 3) ➔

                          )}
                        </div>
                      </div>
                    </div>

                    <div className="pt-4 border-t border-karigar-border space-y-2 text-xs">
                      <h4 className="font-editorial text-base font-bold text-karigar-dark">Living Heritage Craft Story</h4>
                      <p className="text-karigar-muted leading-relaxed">{selectedProductModal.story}</p>
                    </div>
                  </div>
                </div>
              )}
            </div>
          )}

          {/* ========================================================================= */}
          {/* 4. ADMIN & GOVERNANCE PORTAL                                              */}
          {/* ========================================================================= */}
          {currentView === 'admin' && (
            <div className="flex-1 max-w-[1440px] w-full mx-auto px-6 py-10 space-y-8">
              <div className="bg-white rounded-2xl border border-karigar-border p-8 editorial-shadow space-y-6">
                <div className="flex justify-between items-center border-b border-karigar-border pb-4">
                  <div>
                    <h2 className="font-editorial text-2xl font-bold text-karigar-dark">Platform Governance & Sovereign Gate Audit Trail</h2>
                    <p className="text-xs text-karigar-muted mt-1">Immutable transaction log ensuring that AI agents never bypass artisan sign-off.</p>
                  </div>
                  <span className="text-xs px-3 py-1 rounded-full bg-karigar-sage/15 text-karigar-success font-bold border border-karigar-sage/30">
                    Gate Integrity 100%
                  </span>
                </div>

                <div className="grid grid-cols-2 md:grid-cols-4 gap-4 text-xs">
                  <div className="p-4 rounded-xl bg-karigar-bgAlt border border-karigar-border">
                    <span className="text-karigar-muted">Master Artisans</span>
                    <div className="font-editorial text-2xl font-bold text-karigar-dark mt-1">4 Clusters</div>
                  </div>
                  <div className="p-4 rounded-xl bg-karigar-bgAlt border border-karigar-border">
                    <span className="text-karigar-muted">Active Products</span>
                    <div className="font-editorial text-2xl font-bold text-karigar-dark mt-1">3 Listed</div>
                  </div>
                  <div className="p-4 rounded-xl bg-karigar-bgAlt border border-karigar-border">
                    <span className="text-karigar-muted">Total Verified GMV</span>
                    <div className="font-editorial text-2xl font-bold text-karigar-dark mt-1">
                      ₹{negotiationStatus === 'DEAL_FINALIZED' ? '2,73,000' : '48,000'}
                    </div>
                  </div>
                  <div className="p-4 rounded-xl bg-karigar-bgAlt border border-karigar-border">
                    <span className="text-karigar-muted">Gate Violations</span>
                    <div className="font-editorial text-2xl font-bold text-karigar-success mt-1">0 Blocked</div>
                  </div>
                </div>

                {/* Audit Logs Table */}
                <div className="space-y-3 pt-4">
                  <h4 className="font-bold text-xs text-karigar-dark uppercase tracking-wider">Immutable Approval Audit Logs:</h4>
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs border border-karigar-border rounded-xl">
                      <thead className="bg-karigar-bgAlt border-b border-karigar-border text-karigar-muted uppercase text-[10px]">
                        <tr>
                          <th className="p-3">Gate Identifier</th>
                          <th className="p-3">Signatory</th>
                          <th className="p-3">Action Recorded</th>
                          <th className="p-3">Details</th>
                          <th className="p-3">Status</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-karigar-border text-karigar-dark text-xs">
                        <tr>
                          <td className="p-3 font-bold text-karigar-dark">GATE 1 · CATALOGUE</td>
                          <td className="p-3 font-medium">Meena Tai Jadhav</td>
                          <td className="p-3"><span className="px-2 py-0.5 rounded bg-emerald-50 text-karigar-success font-bold text-[10px]">APPROVED</span></td>
                          <td className="p-3 text-karigar-muted">Verified Marathi voice transcript & pit-loom craft story.</td>
                          <td className="p-3 text-karigar-success font-semibold">Immutable</td>
                        </tr>
                        <tr>
                          <td className="p-3 font-bold text-karigar-dark">GATE 2 · PRICING</td>
                          <td className="p-3 font-medium">Meena Tai Jadhav</td>
                          <td className="p-3"><span className="px-2 py-0.5 rounded bg-emerald-50 text-karigar-success font-bold text-[10px]">APPROVED</span></td>
                          <td className="p-3 text-karigar-muted">Fixed public price at ₹5,000 and confidential floor at ₹4,200.</td>
                          <td className="p-3 text-karigar-success font-semibold">Immutable</td>
                        </tr>
                        {negotiationStatus !== 'PENDING_ARTISAN' && (
                          <tr>
                            <td className="p-3 font-bold text-karigar-dark">GATE 3 · COMMERCIAL</td>
                            <td className="p-3 font-medium">Meena Tai Jadhav</td>
                            <td className="p-3"><span className="px-2 py-0.5 rounded bg-emerald-50 text-karigar-success font-bold text-[10px]">APPROVED</span></td>
                            <td className="p-3 text-karigar-muted">Approved counteroffer of ₹4,500/saree for 50 pieces to FabCrafts.</td>
                            <td className="p-3 text-karigar-success font-semibold">Immutable</td>
                          </tr>
                        )}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
